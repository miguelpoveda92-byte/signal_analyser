    NodoOsciloscopioOjo.prototype.onExecute = function() {
        this.lastSignal = this.getInputData(0);
        const sig = this.lastSignal;

        if (sig && this.properties.autoTb) {
            let detectedTb = null;
            if (sig.Tb) detectedTb = sig.Tb;
            else if (sig.Rb) detectedTb = 1.0 / sig.Rb;
            else if (sig.baudios) detectedTb = 1.0 / sig.baudios;
            else if (sig.qamMeta && sig.qamMeta.Ts) detectedTb = sig.qamMeta.Ts;

            if (detectedTb && Math.abs(this.properties.tb - detectedTb) > 1e-4) {
                this.properties.tb = detectedTb;
                if (this.wTb) this.wTb.value = detectedTb;
            }
        }

        // Cálculo de alta densidad de muestras y métricas de telecomunicaciones
        if (sig && sig.values && sig.values.length > 0) {
            this.computeEyeMetrics(sig);
        } else {
            this.eyeMetrics = null;
            this._avgMetrics = null;
        }

        if (!activeOscilloscopes.has(this.id)) {
            activeOscilloscopes.set(this.id, this);
            syncOscSelector(this.id);
        }
    };

    NodoOsciloscopioOjo.prototype.computeEyeMetrics = function(sig) {
        const { dt, tMin, tMax } = getCurrentTimeVector();
        const Tb = Math.max(0.005, Number(this.properties.tb || 0.5));
        const T_span = 2 * Tb;
        const tStart = sig.t_start !== undefined ? sig.t_start : 0;
        const tOffset = Number(this.properties.t_offset || 0);
        const tBase = tStart + tOffset;

        function evalSignal(timeVal) {
            if (sig.sourceNode && typeof sig.sourceNode.evalAt === "function") {
                return sig.sourceNode.evalAt(timeVal, dt);
            }
            if (timeVal < tMin || timeVal > tMax) return 0;
            let idx = (timeVal - tMin) / dt;
            let i0 = Math.floor(idx);
            if (i0 < 0) return sig.values[0];
            if (i0 >= N - 1) return sig.values[N - 1];
            let frac = idx - i0;
            return sig.values[i0] * (1 - frac) + sig.values[i0 + 1] * frac;
        }

        const maxIntervals = Math.max(4, Math.round(Number(this.properties.num_traces || 24)));
        const samplesPerTrace = Math.max(80, Math.round(Number(this.properties.samples_per_trace || 160)));
        const dtSub = T_span / (samplesPerTrace - 1);

        let eyeTracesData = [];
        let midLevelsHigh = [];
        let midLevelsLow = [];
        let zeroCrossingOffsets = [];

        for (let k = 0; k < maxIntervals; k++) {
            let startK = tBase + k * Tb;
            if (startK > tMax || startK + T_span < tMin) continue;

            let traceVals = new Float32Array(samplesPerTrace);
            let prevV = null;
            let prevT = null;

            for (let s = 0; s < samplesPerTrace; s++) {
                let tau = s * dtSub;
                let curT = startK + tau;
                let v = evalSignal(curT);
                traceVals[s] = v;

                // Detección de cruce por cero (umbral central) de alta resolución
                if (prevV !== null && prevV * v <= 0 && prevV !== v) {
                    let frac = Math.abs(prevV) / (Math.abs(prevV) + Math.abs(v));
                    let exactCrossTau = prevT + frac * dtSub;
                    // Los cruces ocurren idealmente cerca de tau = 0, tau = Tb o tau = 2*Tb
                    let distToTb = Math.abs(exactCrossTau - Tb);
                    let distToEdge = Math.min(exactCrossTau, Math.abs(exactCrossTau - T_span));
                    if (distToTb < Tb * 0.45) {
                        zeroCrossingOffsets.push(exactCrossTau - Tb);
                    } else if (distToEdge < Tb * 0.45) {
                        zeroCrossingOffsets.push(exactCrossTau < Tb ? exactCrossTau : exactCrossTau - T_span);
                    }
                }
                prevV = v;
                prevT = tau;
            }

            // Muestra en el centro del ojo (instante óptimo de decisión tau = Tb)
            let midIndex = Math.floor(samplesPerTrace / 2);
            let vDecision = traceVals[midIndex];
            if (vDecision >= 0) midLevelsHigh.push(vDecision);
            else midLevelsLow.push(vDecision);

            eyeTracesData.push(traceVals);
        }

        // Estadísticas instantáneas de Apertura Vertical y Margen de Ruido
        let v1_mean = 0, v0_mean = 0;
        let v1_min = 0, v0_max = 0;
        let std1 = 0, std0 = 0;

        if (midLevelsHigh.length > 0) {
            v1_mean = midLevelsHigh.reduce((a, b) => a + b, 0) / midLevelsHigh.length;
            v1_min = Math.min(...midLevelsHigh);
            let var1 = midLevelsHigh.reduce((acc, x) => acc + Math.pow(x - v1_mean, 2), 0) / midLevelsHigh.length;
            std1 = Math.sqrt(var1);
        }
        if (midLevelsLow.length > 0) {
            v0_mean = midLevelsLow.reduce((a, b) => a + b, 0) / midLevelsLow.length;
            v0_max = Math.max(...midLevelsLow);
            let var0 = midLevelsLow.reduce((acc, x) => acc + Math.pow(x - v0_mean, 2), 0) / midLevelsLow.length;
            std0 = Math.sqrt(var0);
        }

        let instAperturaV = (midLevelsHigh.length > 0 && midLevelsLow.length > 0) 
            ? Math.max(0, v1_min - v0_max) 
            : 0;

        let instAlturaMedia = (midLevelsHigh.length > 0 && midLevelsLow.length > 0)
            ? (v1_mean - v0_mean)
            : 0;

        let instQFactor = (std1 + std0 > 1e-4) ? (instAlturaMedia / (std1 + std0)) : 99.9;

        // Jitter pico a pico (P-P) y RMS a partir de los cruces por cero
        let instJitterRMS = 0;
        let instJitterPP = 0;
        if (zeroCrossingOffsets.length >= 2) {
            let meanCross = zeroCrossingOffsets.reduce((a, b) => a + b, 0) / zeroCrossingOffsets.length;
            let varCross = zeroCrossingOffsets.reduce((acc, x) => acc + Math.pow(x - meanCross, 2), 0) / zeroCrossingOffsets.length;
            instJitterRMS = Math.sqrt(varCross);
            let minC = Math.min(...zeroCrossingOffsets);
            let maxC = Math.max(...zeroCrossingOffsets);
            instJitterPP = maxC - minC;
        }

        let instAnchoOjo = Math.max(0, Tb - instJitterPP);

        // --- Filtro de promedio móvil exponencial (EMA) para estabilizar métricas ---
        if (!this._avgMetrics || this._avgMetrics.Tb !== Tb) {
            this._avgMetrics = {
                Tb: Tb,
                aperturaV: instAperturaV,
                alturaMedia: instAlturaMedia,
                anchoOjo: instAnchoOjo,
                jitterRMS: instJitterRMS,
                jitterPP: instJitterPP,
                qFactor: instQFactor,
                samplesCount: 1
            };
        } else {
            // Factor de suavizado α (ajustado para respuesta suave ante el ruido del canal)
            const alpha = 0.12;
            this._avgMetrics.aperturaV = (1 - alpha) * this._avgMetrics.aperturaV + alpha * instAperturaV;
            this._avgMetrics.alturaMedia = (1 - alpha) * this._avgMetrics.alturaMedia + alpha * instAlturaMedia;
            this._avgMetrics.anchoOjo = (1 - alpha) * this._avgMetrics.anchoOjo + alpha * instAnchoOjo;
            this._avgMetrics.jitterRMS = (1 - alpha) * this._avgMetrics.jitterRMS + alpha * instJitterRMS;
            this._avgMetrics.jitterPP = (1 - alpha) * this._avgMetrics.jitterPP + alpha * instJitterPP;
            this._avgMetrics.qFactor = (1 - alpha) * this._avgMetrics.qFactor + alpha * instQFactor;
            this._avgMetrics.samplesCount++;
        }

        this.eyeMetrics = {
            Tb: Tb,
            T_span: T_span,
            aperturaV: this._avgMetrics.aperturaV,
            alturaMedia: this._avgMetrics.alturaMedia,
            anchoOjo: this._avgMetrics.anchoOjo,
            jitterRMS: this._avgMetrics.jitterRMS,
            jitterPP: this._avgMetrics.jitterPP,
            qFactor: this._avgMetrics.qFactor,
            tracesCount: eyeTracesData.length,
            eyeTracesData: eyeTracesData,
            samplesPerTrace: samplesPerTrace
        };
    };

    NodoOsciloscopioOjo.prototype.onDrawForeground = function(ctx) {
        if (this.flags.collapsed) return;
        const w = this.size[0];
        const startY = 160;
        const miniPlotH = 80;
        const miniPlotW = w - 24;
        const plotX = 12;

        ctx.save();
        // Mini display gráfico del ojo dentro del bloque
        ctx.fillStyle = "#020617";
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(plotX, startY, miniPlotW, miniPlotH, 5);
        ctx.fill();
        ctx.stroke();

        // Ejes y retícula interna
        ctx.strokeStyle = "#1e293b";
        ctx.beginPath();
        ctx.moveTo(plotX, startY + miniPlotH / 2);
        ctx.lineTo(plotX + miniPlotW, startY + miniPlotH / 2);
        ctx.moveTo(plotX + miniPlotW / 2, startY);
        ctx.lineTo(plotX + miniPlotW / 2, startY + miniPlotH);
        ctx.stroke();

        const m = this.eyeMetrics;
        if (m && m.eyeTracesData && m.eyeTracesData.length > 0) {
            // Escala de amplitud
            let maxVal = 1.0;
            for (let tr of m.eyeTracesData) {
                for (let i = 0; i < tr.length; i++) {
                    let a = Math.abs(tr[i]);
                    if (a > maxVal) maxVal = a;
                }
            }
            maxVal = Math.max(0.2, maxVal * 1.15);

            ctx.lineWidth = 1.2;
            ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
            const S = m.samplesPerTrace;

            for (let tr of m.eyeTracesData) {
                ctx.beginPath();
                for (let s = 0; s < S; s++) {
                    let px = plotX + (s / (S - 1)) * miniPlotW;
                    let py = startY + (miniPlotH / 2) - (tr[s] / maxVal) * (miniPlotH * 0.42);
                    if (s === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
        }

        // Panel de Métricas detalladas
        const statsY = startY + miniPlotH + 8;
        const statsH = 75;
        ctx.fillStyle = "#0f172a";
        ctx.strokeStyle = "#334155";
        ctx.beginPath();
        ctx.roundRect(plotX, statsY, miniPlotW, statsH, 5);
        ctx.fill();
        ctx.stroke();

        ctx.font = "9.5px 'Segoe UI', monospace";
        if (!m || m.tracesCount === 0) {
            ctx.fillStyle = "#94a3b8";
            ctx.fillText("Conecta una señal digital", plotX + 10, statsY + 28);
            ctx.fillText("para construir el diagrama de ojo.", plotX + 10, statsY + 44);
        } else {
            // Columna 1 (Valores Promediados)
            ctx.fillStyle = m.aperturaV > 0.15 ? "#4ade80" : "#f87171";
            ctx.fillText(`Apertura V: ${m.aperturaV.toFixed(2)} V`, plotX + 8, statsY + 18);

            ctx.fillStyle = "#38bdf8";
            ctx.fillText(`Ancho Ojo : ${m.anchoOjo.toFixed(3)} s`, plotX + 8, statsY + 36);

            ctx.fillStyle = "#facc15";
            let qStr = m.qFactor > 50 ? ">50" : m.qFactor.toFixed(1);
            ctx.fillText(`Factor Q  : ${qStr}`, plotX + 8, statsY + 54);

            // Columna 2 (Valores Promediados)
            ctx.fillStyle = "#cbd5e1";
            ctx.fillText(`Tb : ${m.Tb.toFixed(3)} s`, plotX + 145, statsY + 18);

            ctx.fillStyle = "#fb923c";
            ctx.fillText(`Jitter P-P: ${(m.jitterPP * 1000).toFixed(1)} ms`, plotX + 145, statsY + 36);

            ctx.fillStyle = "#94a3b8";
            ctx.fillText(`Jitter RMS: ${(m.jitterRMS * 1000).toFixed(1)} ms`, plotX + 145, statsY + 54);
        }

        ctx.restore();
    };
    LiteGraph.registerNodeType("Telecom/OsciloscopioOjo", NodoOsciloscopioOjo);

    async function sha256(message) {
        if (!message) return "";
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    NodoSubgrafo.prototype.updateLockTitle = function() {
        const isLocked = Boolean(this.properties.passwordHash && this.properties.passwordHash.length > 0);
        this.title = (isLocked ? "🔒 " : "🔓 ") + (this.properties.nombre || "Subsistema");
        this.setDirtyCanvas(true, true);
    };

    NodoSubgrafo.prototype.getExtraMenuOptions = function(canvas, options) {
        const that = this;
        const isLocked = Boolean(this.properties.passwordHash);

        if (!isLocked) {
            options.push({
                content: "🔒 Proteger con Contraseña...",
                callback: async () => {
                    const pass = window.prompt(`Asigna una contraseña para proteger "${that.properties.nombre}":`);
                    if (pass && pass.trim().length > 0) {
                        that.properties.passwordHash = await sha256(pass.trim());
                        that.updateLockTitle();
                    }
                }
            });
        } else {
            options.push({
                content: "🔓 Quitar Contraseña...",
                callback: async () => {
                    const pass = window.prompt("Introduce la contraseña actual para eliminar la protección:");
                    if (pass === null) return;
                    const testHash = await sha256(pass.trim());
                    if (testHash === that.properties.passwordHash) {
                        that.properties.passwordHash = "";
                        that.updateLockTitle();
                    }
                }
            });
        }
    };

    NodoSubgrafo.prototype.onDblClick = async function() {
        if (this.properties.passwordHash && this.properties.passwordHash.length > 0) {
            const inputPass = window.prompt(`El subsistema "${this.properties.nombre}" está protegido.\nIntroduce la contraseña:`);
            if (inputPass === null) return;

            const inputHash = await sha256(inputPass.trim());
            if (inputHash !== this.properties.passwordHash) {
                return;
            }
        }
        enterSubgraph(this);
    };

    NodoSubgrafo.prototype.onSerialize = function(o) {
        if (this.subgraph) {
            o.subgraph = this.subgraph.serialize();
        }
    };

    NodoSubgrafo.prototype.onConfigure = function(o) {
        if (o.subgraph) {
            this.subgraph.clear();
            this.subgraph.configure(o.subgraph);
            this.subgraph._parent_node = this;
            this.subgraph.start();
            this.syncPortsFromInner();
        }
        this.updateLockTitle();
    };

    NodoSubgrafo.prototype.syncPortsFromInner = function() {
        if (!this.subgraph) return;
        const inNodes = this.subgraph.findNodesByType("Telecom/Inport");
        const outNodes = this.subgraph.findNodesByType("Telecom/Outport");

        while (this.inputs.length < inNodes.length) {
            let i = this.inputs.length;
            this.addInput(inNodes[i].properties.nombre || `In ${i+1}`, "signal");
        }
        while (this.inputs.length > inNodes.length && this.inputs.length > 0) {
            this.removeInput(this.inputs.length - 1);
        }
        for (let i = 0; i < inNodes.length; i++) {
            this.inputs[i].name = inNodes[i].properties.nombre || `In ${i+1}`;
        }

        while (this.outputs.length < outNodes.length) {
            let i = this.outputs.length;
            this.addOutput(outNodes[i].properties.nombre || `Out ${i+1}`, "signal");
        }
        while (this.outputs.length > outNodes.length && this.outputs.length > 0) {
            this.removeOutput(this.outputs.length - 1);
        }
        for (let i = 0; i < outNodes.length; i++) {
            this.outputs[i].name = outNodes[i].properties.nombre || `Out ${i+1}`;
        }

        this.size[1] = Math.max(85, Math.max(this.inputs.length, this.outputs.length) * 26 + 42);
        this.setDirtyCanvas(true, true);
    };

    NodoSubgrafo.prototype.onExecute = function() {
        if (!this.subgraph) return;
        const inNodes = this.subgraph.findNodesByType("Telecom/Inport");
        const outNodes = this.subgraph.findNodesByType("Telecom/Outport");

        for (let i = 0; i < inNodes.length; i++) {
            let extData = this.getInputData(i);
            inNodes[i]._receivedData = extData;
        }

        this.subgraph.runStep(1);

        for (let i = 0; i < outNodes.length; i++) {
            let innerData = outNodes[i]._exportedData;
            this.setOutputData(i, innerData);
        }
    };
    LiteGraph.registerNodeType("Telecom/Subgrafo", NodoSubgrafo);

        });
        this.title = "📊 " + this.properties.nombre;
        this.size = [235, 65];
        applyLightStyle(this, "#ddd6fe", "#ffffff");
    }
    NodoOsciloscopio.title = "Osciloscopio";
    NodoOsciloscopio.prototype.onAdded = function() {
        activeOscilloscopes.set(this.id, this);
        syncOscSelector(this.id);
    };
    NodoOsciloscopio.prototype.onRemoved = function() {
        activeOscilloscopes.delete(this.id);
        syncOscSelector();
    };
    NodoOsciloscopio.prototype.onExecute = function() {
        this.lastSignal = this.getInputData(0);
        if (!activeOscilloscopes.has(this.id)) {
            activeOscilloscopes.set(this.id, this);
            syncOscSelector(this.id);
        }
    };
    LiteGraph.registerNodeType("Telecom/Osciloscopio", NodoOsciloscopio);

    function syncOscSelector(preferId = null) {
        const sel = document.getElementById("oscSelect");
        const prevVal = preferId !== null ? String(preferId) : sel.value;
        sel.innerHTML = "";
        
        activeOscilloscopes.forEach((node, id) => {
            let opt = document.createElement("option");
            opt.value = String(id);
            opt.textContent = node.properties.nombre;
            sel.appendChild(opt);
        });

        if ([...sel.options].some(o => o.value === prevVal)) {
            sel.value = prevVal;
        } else if (sel.options.length > 0) {
            sel.selectedIndex = 0;
        }
        forcePlotUpdate();
    }


    // ==========================================
    // 4. RENDERIZADO DE GRÁFICAS CON ZOOM INTERACTIVO
    // ==========================================
    let savedTimeRanges = { x: null, y: null };
    let savedFreqRanges = { x: null, y: null };
    let plotsEventsBound = false;

    function forcePlotUpdate() {
        savedFreqRanges = { x: null, y: null };
        dirtyPlots = true;
    }

    function onTimeRangeChanged() {
        savedTimeRanges = { x: null, y: null };
        dirtyPlots = true;
        currentGraph.runStep(1);
    }

    function toggleFreqPlot() {
        showFreqSpectrum = !showFreqSpectrum;
        const btn = document.getElementById("btnToggleFreq");
        const plotFreqDiv = document.getElementById("plot-freq");
        const plotPanel = document.getElementById("plot-panel");

        if (showFreqSpectrum) {
            btn.innerText = "Ocultar |X(f)|";
            plotFreqDiv.classList.remove("hidden");
            plotPanel.classList.remove("single-plot");
        } else {
            btn.innerText = "Mostrar |X(f)|";
            plotFreqDiv.classList.add("hidden");
            plotPanel.classList.add("single-plot");
        }
        Plotly.Plots.resize('plot-time');
        dirtyPlots = true;
    }

    function bindPlotZoomListeners() {
        if (plotsEventsBound) return;
        const pt = document.getElementById("plot-time");
        const pf = document.getElementById("plot-freq");

        if (pt && typeof pt.on === "function") {
            pt.on("plotly_relayout", (ed) => {
                if (ed["xaxis.autorange"] || ed["yaxis.autorange"]) {
                    savedTimeRanges = { x: null, y: null };
                } else {
                    if (ed["xaxis.range[0]"] !== undefined && ed["xaxis.range[1]"] !== undefined) {
                        savedTimeRanges.x = [ed["xaxis.range[0]"], ed["xaxis.range[1]"]];
                    } else if (Array.isArray(ed["xaxis.range"])) {
                        savedTimeRanges.x = [...ed["xaxis.range"]];
                    }
                    if (ed["yaxis.range[0]"] !== undefined && ed["yaxis.range[1]"] !== undefined) {
                        savedTimeRanges.y = [ed["yaxis.range[0]"], ed["yaxis.range[1]"]];
                    } else if (Array.isArray(ed["yaxis.range"])) {
                        savedTimeRanges.y = [...ed["yaxis.range"]];
                    }
                }
            });
            plotsEventsBound = true;
        }

        if (pf && typeof pf.on === "function") {
            pf.on("plotly_relayout", (ed) => {
                if (ed["xaxis.autorange"] || ed["yaxis.autorange"]) {
                    savedFreqRanges = { x: null, y: null };
                } else {
                    if (ed["xaxis.range[0]"] !== undefined && ed["xaxis.range[1]"] !== undefined) {
                        savedFreqRanges.x = [ed["xaxis.range[0]"], ed["xaxis.range[1]"]];
                    } else if (Array.isArray(ed["xaxis.range"])) {
                        savedFreqRanges.x = [...ed["xaxis.range"]];
                    }
                    if (ed["yaxis.range[0]"] !== undefined && ed["yaxis.range[1]"] !== undefined) {
                        savedFreqRanges.y = [ed["yaxis.range[0]"], ed["yaxis.range[1]"]];
                    } else if (Array.isArray(ed["yaxis.range"])) {
                        savedFreqRanges.y = [...ed["yaxis.range"]];
                    }
                }
            });
        }
    }

    function updatePlots() {
        if (!dirtyPlots) return;
        dirtyPlots = false;

        const panel = document.getElementById("plot-panel");
        if (panel.classList.contains("hidden")) return;

        const sel = document.getElementById("oscSelect");
        const selId = (sel && sel.value !== "") ? Number(sel.value) : -1;
        const oscNode = activeOscilloscopes.get(selId);
        const in1 = (oscNode && oscNode.getInputData(0)) ? oscNode.getInputData(0) : (oscNode ? oscNode.lastSignal : null);

        const { t, tMin, tMax, dt } = getCurrentTimeVector();
        const fMax = Math.abs(parseFloat(document.getElementById("fMax").value)) || 50.0;
        const { axis: active_f_axis } = getActiveFrequencyAxis(fMax);

        const oscName = oscNode ? oscNode.properties.nombre : "Sin Osciloscopio activo";
        const sigName = (in1 && in1.name) ? in1.name : "Señal";
        const y = (in1 && in1.values) ? in1.values : new Array(N).fill(0);
        const isDisc = in1 ? in1.discrete : false;
        const isEyeScope = oscNode && oscNode.type === "Telecom/OsciloscopioOjo";

        let timeTraces = [];
        let xLabel = isDisc ? "n (índice entero)" : "Tiempo t (s)";

        // Representación de alta resolución del diagrama de ojo en Plotly
        if (isEyeScope && in1 && in1.values) {
            const Tb = Math.max(0.005, Number(oscNode.properties.tb || 0.5));
            const T_eye = 2 * Tb;
            const tStart = in1.t_start !== undefined ? in1.t_start : 0;
            const tOffset = Number(oscNode.properties.t_offset || 0);
            const tBase = tStart + tOffset;
            const numTraces = Math.max(8, Math.round(Number(oscNode.properties.num_traces || 24)));
            const samplesPerTrace = 160;
            const dtTrace = T_eye / (samplesPerTrace - 1);

            function evalEyeSignal(timeVal) {
                if (in1.sourceNode && typeof in1.sourceNode.evalAt === "function") {
                    return in1.sourceNode.evalAt(timeVal, dt);
                }
                if (timeVal < tMin || timeVal > tMax) return 0;
                let idx = (timeVal - tMin) / dt;
                let i0 = Math.floor(idx);
                if (i0 < 0) return in1.values[0];
                if (i0 >= N - 1) return in1.values[N - 1];
                let frac = idx - i0;
                return in1.values[i0] * (1 - frac) + in1.values[i0 + 1] * frac;
            }

            let eyeTimeAxis = [];
            for (let s = 0; s < samplesPerTrace; s++) eyeTimeAxis.push(s * dtTrace);

            for (let k = 0; k < numTraces; k++) {
                let startK = tBase + k * Tb;
                if (startK > tMax || startK + T_eye < tMin) continue;

                let yTrace = [];
                for (let s = 0; s < samplesPerTrace; s++) {
                    let ti = startK + s * dtTrace;
                    yTrace.push(evalEyeSignal(ti));
                }

                // Trazas translúcidas superpuestas: el solapamiento genera el mapa de densidad e intensifica el ojo y el jitter
                timeTraces.push({
                    x: eyeTimeAxis,
                    y: yTrace,
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: 'rgba(37, 99, 235, 0.32)', width: 1.5 },
                    showlegend: k === 0,
                    name: `Ojo (2·Tb)`
                });
            }

            // Marcador visual vertical en el instante óptimo de decisión (t = Tb)
            let yMinEye = -1.5, yMaxEye = 1.5;
            if (timeTraces.length > 0) {
                let allY = timeTraces.flatMap(tr => tr.y);
                if (allY.length > 0) {
                    yMinEye = Math.min(...allY);
                    yMaxEye = Math.max(...allY);
                }
            }
            timeTraces.push({
                x: [Tb, Tb],
                y: [yMinEye * 1.1, yMaxEye * 1.1],
                type: 'scatter',
                mode: 'lines',
                line: { color: '#ef4444', width: 1.5, dash: 'dot' },
                name: 'Instante decisión (Tb)'
            });

            let metricInfo = oscNode.eyeMetrics ? ` | Apertura=${oscNode.eyeMetrics.aperturaV.toFixed(2)}V, Jitter=${(oscNode.eyeMetrics.jitterPP * 1000).toFixed(1)}ms` : "";
            xLabel = `Tiempo en ventana 2·Tb (s) [Tb = ${Tb.toFixed(3)}s]${metricInfo}`;
        } else if (isDisc && in1 && in1.stemX) {
            let stemX_lines = [];
            let stemY_lines = [];
            for (let i = 0; i < in1.stemX.length; i++) {
                stemX_lines.push(in1.stemX[i], in1.stemX[i], null);
                stemY_lines.push(0, in1.stemY[i], null);
            }

            timeTraces.push({
                x: stemX_lines,
                y: stemY_lines,
                type: 'scatter',
                mode: 'lines',
                line: { color: '#2563eb', width: 1.5 },
                showlegend: false
            });
            timeTraces.push({
                x: in1.stemX,
                y: in1.stemY,
                type: 'scatter',
                mode: 'markers',
                marker: { color: '#1d4ed8', size: 6 },
                name: sigName
            });
        } else {
            timeTraces.push({
                x: t,
                y: y,
                type: 'scatter',
                mode: 'lines',
                line: { color: '#2563eb', width: 2 },
                name: sigName
            });
        }

        const defaultTimeRange = isEyeScope ? [0, 2 * Math.max(0.01, Number(oscNode.properties.tb || 0.5))] : [tMin, tMax];
        const timeXAxis = {
            title: xLabel,
            range: savedTimeRanges.x ? savedTimeRanges.x : defaultTimeRange,
            gridcolor: '#e2e8f0',
            zerolinecolor: '#94a3b8'
        };
        const timeYAxis = {
            title: 'Amplitud (V)',
            gridcolor: '#e2e8f0',
            zerolinecolor: '#94a3b8'
        };
        if (savedTimeRanges.y) {
            timeYAxis.range = savedTimeRanges.y;
        }

        const plotConfig = {
            responsive: true,
            scrollZoom: true,
            displayModeBar: true,
            displaylogo: false,
            modeBarButtonsToRemove: ['lasso2d', 'select2d']
        };

        const chartTitle = isEyeScope 
            ? `<b>Diagrama de Ojo — ${oscName}</b> [${sigName}]`
            : `<b>Dominio del Tiempo — ${oscName}</b> [${sigName}]`;

        Plotly.react('plot-time', timeTraces, {
            title: { text: chartTitle, font: { size: 12, color: '#1e293b' } },
            dragmode: 'zoom',
            xaxis: timeXAxis,
            yaxis: timeYAxis,
            margin: { t: 34, b: 36, l: 48, r: 16 },
            paper_bgcolor: '#ffffff', plot_bgcolor: '#ffffff',
            showlegend: true,
            legend: { x: 0.7, y: 0.98, bgcolor: 'rgba(255,255,255,0.7)' }
        }, plotConfig);

        if (showFreqSpectrum) {
            let signalDt = in1 && in1.dt ? in1.dt : dt;
            let spectrum = in1 ? computeSpectrum(in1, signalDt, active_f_axis) : new Array(active_f_axis.length).fill(0);
            let freqTraces = [{
                x: active_f_axis,
                y: spectrum,
                type: 'scatter',
                mode: 'lines',
                fill: 'tozeroy',
                fillcolor: 'rgba(225, 29, 72, 0.12)',
                line: { color: '#e11d48', width: 2 },
                name: `|${sigName}(f)|`
            }];

            if (in1 && in1.filterParams && in1.filterParams.showH) {
                const fp = in1.filterParams;
                const H_active = active_f_axis.map(f => evaluateFilterH(f, fp.tipo, fp.aprox, fp.fc, fp.bw, fp.orden, fp.gain));
                let maxSpec = Math.max(...spectrum, 0.5);
                let maxH = Math.max(...H_active, 1);
                let scaledH = H_active.map(v => v * (maxSpec / maxH));
                freqTraces.push({
                    x: active_f_axis,
                    y: scaledH,
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#475569', width: 2, dash: 'dash' },
                    name: '|H(f)| filtro'
                });
            }

            const freqXAxis = {
                title: 'Frecuencia f (Hz)',
                range: savedFreqRanges.x ? savedFreqRanges.x : [-fMax, fMax],
                gridcolor: '#e2e8f0',
                zerolinecolor: '#94a3b8'
            };
            const freqYAxis = {
                title: 'Magnitud',
                gridcolor: '#e2e8f0',
                zerolinecolor: '#94a3b8'
            };
            if (savedFreqRanges.y) {
                freqYAxis.range = savedFreqRanges.y;
            } else {
                freqYAxis.rangemode = 'tozero';
            }

            Plotly.react('plot-freq', freqTraces, {
                title: { text: `<b>Espectro de Frecuencia — ${oscName}</b> (Resolución adaptativa)`, font: { size: 12, color: '#1e293b' } },
                dragmode: 'zoom',
                xaxis: freqXAxis,
                yaxis: freqYAxis,
                margin: { t: 34, b: 36, l: 48, r: 16 },
                paper_bgcolor: '#ffffff', plot_bgcolor: '#ffffff',
                showlegend: true,
                legend: { x: 0.7, y: 0.98, bgcolor: 'rgba(255,255,255,0.7)' }
            }, plotConfig);
        }

        bindPlotZoomListeners();
    }

    // ==========================================
    // 5. SELECCIÓN MÚLTIPLE Y ENCAPSULADO EN SUBSISTEMA
    // ==========================================
    const mainGraph = new LiteGraph.LGraph();
    let currentGraph = mainGraph;
    const canvasElement = document.getElementById("mycanvas");
    const canvas = new LiteGraph.LGraphCanvas(canvasElement, mainGraph);

    canvas.background_image = null;
    canvas.clear_background_color = "#f1f5f9";
    canvas.render_curved_connections = true;
    canvas.default_link_color = "#64748b";
    canvas.allow_MultipleSelection = true;

    let boxSelectionMode = false;
    let customDragRect = null;

    function toggleSelectionMode() {
        boxSelectionMode = !boxSelectionMode;
        const btn = document.getElementById("btnSelectMode");
        if (boxSelectionMode) {
            btn.classList.add("active-mode");
        } else {
            btn.classList.remove("active-mode");
            customDragRect = null;
        }
    }

    canvasElement.addEventListener("mousedown", function(e) {
        if (e.button !== 0) return;
        canvas.adjustMouseEvent(e);
        const node = currentGraph.getNodeOnPos(e.canvasX, e.canvasY, canvas.visible_nodes);
        if (!node && (boxSelectionMode || e.shiftKey)) {
            customDragRect = {
                x0: e.canvasX,
                y0: e.canvasY,
                x1: e.canvasX,
                y1: e.canvasY
            };
            canvas.dragging_canvas = false;
            e.stopImmediatePropagation();
            e.preventDefault();
        }
    }, true);

    window.addEventListener("mousemove", function(e) {
        if (!customDragRect) return;
        canvas.adjustMouseEvent(e);
        customDragRect.x1 = e.canvasX;
        customDragRect.y1 = e.canvasY;
        canvas.dragging_canvas = false;
        canvas.setDirty(true, true);
        e.stopImmediatePropagation();
    }, true);

    window.addEventListener("mouseup", function(e) {
        if (!customDragRect) return;
        const minX = Math.min(customDragRect.x0, customDragRect.x1);
        const maxX = Math.max(customDragRect.x0, customDragRect.x1);
        const minY = Math.min(customDragRect.y0, customDragRect.y1);
        const maxY = Math.max(customDragRect.y0, customDragRect.y1);

        const toSelect = [];
        const nodes = currentGraph._nodes || [];
        for (let n of nodes) {
            const nx = n.pos[0], ny = n.pos[1];
            const nw = n.size[0], nh = n.size[1];
            if (nx + nw >= minX && nx <= maxX && ny + nh >= minY && ny <= maxY) {
                toSelect.push(n);
            }
        }
        canvas.deselectAllNodes();
        if (toSelect.length > 0) {
            canvas.selectNodes(toSelect);
        }
        customDragRect = null;
        canvas.setDirty(true, true);
    }, true);

    const origOnDrawOverlay = canvas.onDrawOverlay;
    canvas.onDrawOverlay = function(ctx) {
        if (origOnDrawOverlay) origOnDrawOverlay.call(this, ctx);
        if (!customDragRect) return;

        ctx.save();
        this.ds.toCanvasContext(ctx);
        const x = Math.min(customDragRect.x0, customDragRect.x1);
        const y = Math.min(customDragRect.y0, customDragRect.y1);
        const w = Math.abs(customDragRect.x1 - customDragRect.x0);
        const h = Math.abs(customDragRect.y1 - customDragRect.y0);

        ctx.fillStyle = "rgba(59, 130, 246, 0.14)";
        ctx.strokeStyle = "#2563eb";
        ctx.lineWidth = 1.5 / this.ds.scale;
        ctx.fillRect(x, y, w, h);
        ctx.strokeRect(x, y, w, h);
        ctx.restore();
    };

    const origGetCanvasMenuOptions = canvas.getCanvasMenuOptions;
    canvas.getCanvasMenuOptions = function() {
        const opts = origGetCanvasMenuOptions ? origGetCanvasMenuOptions.apply(this, arguments) : [];
        const selCount = Object.keys(this.selected_nodes || {}).length;
        if (selCount > 0) {
            opts.push(null);
            opts.push({
                content: `📦 Encapsular ${selCount} bloque(s) en Caja Subsistema`,
                callback: () => encapsulateSelectedNodes()
            });
        }
        return opts;
    };

    const origGetNodeMenuOptions = canvas.getNodeMenuOptions;
    canvas.getNodeMenuOptions = function(node) {
        const opts = origGetNodeMenuOptions ? origGetNodeMenuOptions.apply(this, arguments) : [];
        const selCount = Object.keys(this.selected_nodes || {}).length;
        if (selCount > 1) {
            opts.push(null);
            opts.push({
                content: `📦 Encapsular ${selCount} bloques seleccionados en Subsistema`,
                callback: () => encapsulateSelectedNodes()
            });
        }
        return opts;
    };

    function encapsulateSelectedNodes() {
        const selectedMap = canvas.selected_nodes || {};
        const selectedNodes = Object.values(selectedMap).filter(
            n => n.type !== "Telecom/Inport" && n.type !== "Telecom/Outport"
        );
        if (selectedNodes.length === 0) return;

        const selectedIds = new Set(selectedNodes.map(n => n.id));

        let avgX = 0, avgY = 0;
        let minX = Infinity, minY = Infinity, maxX = -Infinity;
        selectedNodes.forEach(n => {
            avgX += n.pos[0];
            avgY += n.pos[1];
            if (n.pos[0] < minX) minX = n.pos[0];
            if (n.pos[1] < minY) minY = n.pos[1];
            if (n.pos[0] + n.size[0] > maxX) maxX = n.pos[0] + n.size[0];
        });
        avgX /= selectedNodes.length;
        avgY /= selectedNodes.length;

        const internalLinks = [];
        const incomingLinks = [];
        const outgoingLinks = [];

        Object.values(currentGraph.links || {}).forEach(link => {
            if (!link) return;
            const origIn = selectedIds.has(link.origin_id);
            const targetIn = selectedIds.has(link.target_id);
            if (origIn && targetIn) {
                internalLinks.push({ ...link });
            } else if (!origIn && targetIn) {
                incomingLinks.push({ ...link });
            } else if (origIn && !targetIn) {
                outgoingLinks.push({ ...link });
            }
        });

        const subNode = LiteGraph.createNode("Telecom/Subgrafo");
        subNode.pos = [avgX, avgY];
        currentGraph.add(subNode);

        subNode.subgraph.clear();

        const idMap = new Map();
        selectedNodes.forEach(oldNode => {
            const data = oldNode.serialize();
            const newNode = LiteGraph.createNode(oldNode.type);
            newNode.configure(data);
            newNode.pos = [
                oldNode.pos[0] - minX + 240,
                oldNode.pos[1] - minY + 80
            ];
            subNode.subgraph.add(newNode);
            idMap.set(oldNode.id, newNode);

            if (oldNode.type === "Telecom/Osciloscopio") {
                activeOscilloscopes.delete(oldNode.id);
                activeOscilloscopes.set(newNode.id, newNode);
            }
        });

        internalLinks.forEach(l => {
            const src = idMap.get(l.origin_id);
            const dst = idMap.get(l.target_id);
            if (src && dst) {
                src.connect(l.origin_slot, dst, l.target_slot);
            }
        });

        const inportMap = new Map();
        const externalToConnectIn = [];
        incomingLinks.forEach(l => {
            const key = `${l.origin_id}:${l.origin_slot}`;
            let portIndex;
            let inNode;
            if (!inportMap.has(key)) {
                portIndex = inportMap.size;
                inNode = LiteGraph.createNode("Telecom/Inport");
                const portName = `In ${portIndex + 1}`;
                inNode.properties.nombre = portName;
                inNode.title = "↳ " + portName;
                if (inNode.widgets && inNode.widgets[0]) inNode.widgets[0].value = portName;
                inNode.pos = [40, 80 + portIndex * 90];
                subNode.subgraph.add(inNode);
                inportMap.set(key, { portIndex, inNode });
                externalToConnectIn.push({ origin_id: l.origin_id, origin_slot: l.origin_slot, portIndex });
            } else {
                const entry = inportMap.get(key);
                portIndex = entry.portIndex;
                inNode = entry.inNode;
            }
            const dst = idMap.get(l.target_id);
            if (inNode && dst) {
                inNode.connect(0, dst, l.target_slot);
            }
        });

        const outportMap = new Map();
        const externalToConnectOut = [];
        outgoingLinks.forEach(l => {
            const key = `${l.origin_id}:${l.origin_slot}`;
            let portIndex;
            let outNode;
            if (!outportMap.has(key)) {
                portIndex = outportMap.size;
                outNode = LiteGraph.createNode("Telecom/Outport");
                const portName = `Out ${portIndex + 1}`;
                outNode.properties.nombre = portName;
                outNode.title = "↱ " + portName;
                if (outNode.widgets && outNode.widgets[0]) outNode.widgets[0].value = portName;
                outNode.pos = [maxX - minX + 340, 80 + portIndex * 90];
                subNode.subgraph.add(outNode);
                outportMap.set(key, { portIndex, outNode });

                const src = idMap.get(l.origin_id);
                if (src) {
                    src.connect(l.origin_slot, outNode, 0);
                }
            } else {
                const entry = outportMap.get(key);
                portIndex = entry.portIndex;
                outNode = entry.outNode;
            }
            externalToConnectOut.push({ portIndex, target_id: l.target_id, target_slot: l.target_slot });
        });

        subNode.syncPortsFromInner();
        subNode.subgraph.start();
        syncAllWidgets(subNode.subgraph);

        externalToConnectIn.forEach(item => {
            const extOrigin = currentGraph.getNodeById(item.origin_id);
            if (extOrigin) {
                extOrigin.connect(item.origin_slot, subNode, item.portIndex);
            }
        });

        externalToConnectOut.forEach(item => {
            const extTarget = currentGraph.getNodeById(item.target_id);
            if (extTarget) {
                subNode.connect(item.portIndex, extTarget, item.target_slot);
            }
        });

        selectedNodes.forEach(oldNode => {
            currentGraph.remove(oldNode);
        });

        canvas.deselectAllNodes();
        canvas.selectNodes([subNode]);
        syncOscSelector();
        dirtyPlots = true;
        canvas.setDirty(true, true);
    }

    canvas.onNodeSelected = function(node) {
        if (node && node.type === "Telecom/Osciloscopio") {
            const sel = document.getElementById("oscSelect");
            sel.value = String(node.id);
            dirtyPlots = true;
        }
    };

    function applyZoom(factor, centerX, centerY) {
        const rect = canvasElement.getBoundingClientRect();
        const cx = centerX !== undefined ? (centerX - rect.left) : (rect.width / 2);
        const cy = centerY !== undefined ? (centerY - rect.top) : (rect.height / 2);

        const prevScale = canvas.ds.scale;
        let newScale = prevScale * factor;
        newScale = Math.max(0.15, Math.min(3.5, newScale));

        canvas.ds.offset[0] = cx - (cx - canvas.ds.offset[0]) * (newScale / prevScale);
        canvas.ds.offset[1] = cy - (cy - canvas.ds.offset[1]) * (newScale / prevScale);
        canvas.ds.scale = newScale;
        canvas.setDirty(true, true);
    }

    function enableTouchSupport(canvasElem) {
        let isTwoFingers = false;
        let lastPinchDist = 0;
        let lastMidX = 0;
        let lastMidY = 0;

        function triggerMouseEvent(touch, mouseEventType) {
            const simulatedEvent = new MouseEvent(mouseEventType, {
                bubbles: true,
                cancelable: true,
                view: window,
                clientX: touch.clientX,
                clientY: touch.clientY,
                screenX: touch.screenX,
                screenY: touch.screenY,
                button: 0,
                buttons: mouseEventType === "mouseup" ? 0 : 1
            });
            canvasElem.dispatchEvent(simulatedEvent);
        }

        canvasElem.addEventListener("touchstart", function (e) {
            if (e.touches.length === 1) {
                isTwoFingers = false;
                triggerMouseEvent(e.touches[0], "mousedown");
                e.preventDefault();
            } else if (e.touches.length === 2) {
                isTwoFingers = true;
                triggerMouseEvent(e.touches[0], "mouseup");

                const t0 = e.touches[0];
                const t1 = e.touches[1];
                lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
                lastMidX = (t0.clientX + t1.clientX) / 2;
                lastMidY = (t0.clientY + t1.clientY) / 2;
                e.preventDefault();
            }
        }, { passive: false });

        canvasElem.addEventListener("touchmove", function (e) {
            if (!isTwoFingers && e.touches.length === 1) {
                triggerMouseEvent(e.touches[0], "mousemove");
                e.preventDefault();
            } else if (e.touches.length === 2) {
                const t0 = e.touches[0];
                const t1 = e.touches[1];
                const currentDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
                const currentMidX = (t0.clientX + t1.clientX) / 2;
                const currentMidY = (t0.clientY + t1.clientY) / 2;

                if (lastPinchDist > 0 && currentDist > 0) {
                    const factor = currentDist / lastPinchDist;
                    applyZoom(factor, currentMidX, currentMidY);
                }

                const dx = currentMidX - lastMidX;
                const dy = currentMidY - lastMidY;
                canvas.ds.offset[0] += dx;
                canvas.ds.offset[1] += dy;
                canvas.setDirty(true, true);

                lastPinchDist = currentDist;
                lastMidX = currentMidX;
                lastMidY = currentMidY;
                e.preventDefault();
            }
        }, { passive: false });

        canvasElem.addEventListener("touchend", function (e) {
            if (isTwoFingers) {
                if (e.touches.length < 2) {
                    isTwoFingers = false;
                    lastPinchDist = 0;
                }
                e.preventDefault();
            } else if (e.changedTouches.length > 0) {
                triggerMouseEvent(e.changedTouches[0], "mouseup");
                e.preventDefault();
            }
        }, { passive: false });
    }
    enableTouchSupport(canvasElement);

    function resizeCanvas() {
        const container = document.getElementById("canvas-container");
        const w = container.clientWidth;
        const h = container.clientHeight;
        canvasElement.style.width = w + "px";
        canvasElement.style.height = h + "px";
        canvas.resize(w, h);
        Plotly.Plots.resize('plot-time');
        Plotly.Plots.resize('plot-freq');
        canvas.setDirty(true, true);
        dirtyPlots = true;
    }
    window.addEventListener("resize", resizeCanvas);

    function enterSubgraph(node) {
        currentGraph = node.subgraph;
        canvas.setGraph(currentGraph);
        document.getElementById("subgraph-banner").style.display = "block";
        syncAllWidgets(currentGraph);
        dirtyPlots = true;
    }

    function exitSubgraph() {
        if (currentGraph._parent_node) {
            currentGraph._parent_node.syncPortsFromInner();
        }
        currentGraph = mainGraph;
        canvas.setGraph(mainGraph);
        document.getElementById("subgraph-banner").style.display = "none";
        syncAllWidgets(mainGraph);
        dirtyPlots = true;
    }

    let lastExecutionTime = 0;
    const SIMULATION_INTERVAL_MS = 60; // Frecuencia de cálculo y refresco (aprox. 16 FPS para mantener alto rendimiento)

    function mainLoop(timestamp) {
        if (isRunning) {
            if (timestamp - lastExecutionTime >= SIMULATION_INTERVAL_MS) {
                lastExecutionTime = timestamp;
                if (mainGraph.status === LiteGraph.LGraph.STATUS_RUNNING) {
                    mainGraph.runStep(1);
                }

                // Redibujado exclusivo del lienzo del canvas (nodos, diagrama de ojo y constelaciones)
                canvas.draw(true, true);
            }
        }

        // Las gráficas Plotly sólo se renderizan cuando dirtyPlots es explícitamente activado por el usuario
        if (dirtyPlots) {
            updatePlots();
        }
        requestAnimationFrame(mainLoop);
    }

    const resizer = document.getElementById("resizer");
    const plotPanel = document.getElementById("plot-panel");
    let isDragging = false;

    resizer.addEventListener("mousedown", () => {
        isDragging = true;
        resizer.classList.add("dragging");
        document.body.style.cursor = "col-resize";
    });

    window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const newWidth = window.innerWidth - e.clientX;
        if (newWidth > 260 && newWidth < window.innerWidth * 0.8) {
            plotPanel.style.width = newWidth + "px";
            resizeCanvas();
        }
    });

    window.addEventListener("mouseup", () => {
        if (isDragging) {
            isDragging = false;
            resizer.classList.remove("dragging");
            document.body.style.cursor = "default";
            resizeCanvas();
        }
    });

    function togglePlotPanel() {
        const btn = document.getElementById("toggle-panel-btn");
        if (plotPanel.classList.contains("hidden")) {
            plotPanel.classList.remove("hidden");
            resizer.style.display = "block";
            btn.innerText = "👁️ Ocultar Gráficas";
        } else {
            plotPanel.classList.add("hidden");
            resizer.style.display = "none";
            btn.innerText = "👁️ Mostrar Gráficas";
        }
        resizeCanvas();
    }

    let spawnOffset = 0;
    function addModule(type) {
        let node = LiteGraph.createNode(type);
        spawnOffset = (spawnOffset + 25) % 125;
        node.pos = [50 + spawnOffset, 70 + spawnOffset];
        currentGraph.add(node);
        dirtyPlots = true;
    }

    function resetView() {
        canvas.ds.scale = 1;
        canvas.ds.offset = [0, 0];
        canvas.setDirty(true, true);
    }

    function clearCanvas() {
        if (currentGraph !== mainGraph) {
            currentGraph = mainGraph;
            canvas.setGraph(mainGraph);
            document.getElementById("subgraph-banner").style.display = "none";
        }
        mainGraph.clear();
        activeOscilloscopes.clear();
        oscCounter = 1;
        savedTimeRanges = { x: null, y: null };
        savedFreqRanges = { x: null, y: null };
        lastRenderedSignalHash = "";

        const sel = document.getElementById("oscSelect");
        if (sel) sel.innerHTML = "";

        mainGraph.start();
        dirtyPlots = true;
        updatePlots();
        canvas.setDirty(true, true);
    }

    // ==========================================
    // 6. GESTIÓN DE ESQUEMÁTICOS (GUARDAR / CARGAR)
    // ==========================================
    function saveGraphToFile() {
        const graphData = mainGraph.serialize();
        const jsonStr = JSON.stringify(graphData, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement("a");
        a.href = url;
        a.download = "esquematico_telecom.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function loadGraphFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                restaurarEsquematico(data);
            } catch (err) {
                console.error("Error al cargar el archivo de esquemático:", err);
            }
        };
        reader.readAsText(file);
        event.target.value = "";
    }

    function saveToLocalStorage() {
        const graphData = mainGraph.serialize();
        localStorage.setItem("simutelecom_saved_graph", JSON.stringify(graphData));
    }

    function loadFromLocalStorage() {
        const saved = localStorage.getItem("simutelecom_saved_graph");
        if (!saved) return;
        try {
            const data = JSON.parse(saved);
            restaurarEsquematico(data);
        } catch (err) {
            console.error("Error al restaurar esquemático:", err);
        }
    }

    function syncAllWidgets(g) {
        if (!g || !g._nodes) return;
        g._nodes.forEach(node => {
            if (node.type === "Telecom/GeneradorContinuo" && typeof node.updateWidgetVisibility === "function") {
                node.updateWidgetVisibility();
            }
            if (node.type === "Telecom/Filtro" && typeof node.updateWidgetsVisibility === "function") {
                node.updateWidgetsVisibility();
            }
            if (node.widgets && node.properties) {
                node.widgets.forEach(w => {
                    let propKey = null;
                    if (w.name.includes("Etiqueta") || w.name.includes("Nombre") || w.name.includes("ID")) propKey = "nombre";
                    else if (w.name.includes("Señal")) propKey = "tipo";
                    else if (w.name.includes("Amplitud")) propKey = "amp";
                    else if (w.name.includes("Periodo T") || w.name.includes("Periodo Tb")) propKey = (node.type === "Telecom/OsciloscopioOjo" ? "tb" : "periodo");
                    else if (w.name.includes("Frec") || w.name.includes("Portadora") || w.name.includes("fc") || w.name.includes("f0")) propKey = (node.properties.fc !== undefined ? "fc" : "freq");
                    else if (w.name.includes("Ancho Bw") || w.name.includes("Ancho B")) propKey = "bw";
                    else if (w.name.includes("Ancho") || w.name.includes("Duración")) propKey = "ancho";
                    else if (w.name.includes("Tau")) propKey = "tau";
                    else if (w.name.includes("Desplaz")) propKey = "t0";
                    else if (w.name.includes("Escalado") || w.name.includes("Diezmado")) propKey = "a";
                    else if (w.name.includes("Inversión")) propKey = "inv";
                    else if (w.name.includes("Valores")) propKey = "valores";
                    else if (w.name.includes("Inicio n0")) propKey = "n0";
                    else if (w.name.includes("Bits")) propKey = "bits";
                    else if (w.name.includes("Código")) propKey = "codigo";
                    else if (w.name.includes("Tasa") || w.name.includes("Baudios")) propKey = (node.properties.baudios !== undefined ? "baudios" : "rb");
                    else if (w.name.includes("Inicio t0") || w.name.includes("Offset t0")) propKey = (node.type === "Telecom/OsciloscopioOjo" ? "t_offset" : "t_start");
                    else if (w.name.includes("Auto Tb/Ts")) propKey = "autoTb";
                    else if (w.name.includes("Trazas máx")) propKey = "num_traces";
                    else if (w.name.includes("Auto-Sincronizar")) propKey = "autoSync";
                    else if (w.name.includes("Auto-Alinear")) propKey = "autoAlinear";
                    else if (w.name.includes("Acumular")) propKey = "acumular";
                    else if (w.name.includes("N.º Símbolos")) propKey = "num_sym";
                    else if (w.name.includes("Atenuación")) propKey = "atenuacion";
                    else if (w.name.includes("Ruido")) propKey = "ruido";
                    else if (w.name.includes("Retardo")) propKey = "retardo";
                    else if (w.name.includes("k1")) propKey = "k1";
                    else if (w.name.includes("k2")) propKey = "k2";
                    else if (w.name.includes("Ganancia")) propKey = (node.properties.gain !== undefined ? "gain" : "k");
                    else if (w.name.includes("Tipo")) propKey = "tipo";
                    else if (w.name.includes("Resp")) propKey = "aprox";
                    else if (w.name.includes("Orden")) propKey = "orden";
                    else if (w.name.includes("Ver |H(f)|")) propKey = "showH";
                    else if (w.name.includes("fs")) propKey = "fs_sample";
                    else if (w.name.includes("Índice Mod")) propKey = "mu";
                    else if (w.name.includes("Índice β")) propKey = "beta";
                    else if (w.name.includes("Sensibilidad")) propKey = "kp";
                    else if (w.name.includes("Constelación")) propKey = "tipo";
                    else if (w.name.includes("Quitar DC")) propKey = "removeDC";

                    if (propKey && node.properties[propKey] !== undefined) {
                        w.value = node.properties[propKey];
                    }
                });
            }

            if (node.title && node.properties && node.properties.nombre) {
                if (node.type === "Telecom/Osciloscopio") node.title = "📊 " + node.properties.nombre;
                else if (node.type === "Telecom/OsciloscopioOjo") node.title = "👁️ " + node.properties.nombre;
                else if (node.type === "Telecom/MedidorBER") node.title = "🎯 " + node.properties.nombre;
                else if (node.type === "Telecom/Inport") node.title = "↳ " + node.properties.nombre;
                else if (node.type === "Telecom/Outport") node.title = "↱ " + node.properties.nombre;
            }

            if (node.subgraph) {
                syncAllWidgets(node.subgraph);
            }
        });
        g.setDirtyCanvas(true, true);
    }

    function restaurarEsquematico(data) {
        mainGraph.clear();
        activeOscilloscopes.clear();
        savedTimeRanges = { x: null, y: null };
        savedFreqRanges = { x: null, y: null };
        
        mainGraph.configure(data);

        const subgrafos = mainGraph.findNodesByType("Telecom/Subgrafo");
        subgrafos.forEach(sgNode => {
            if (sgNode.subgraph) {
                sgNode.subgraph.start();
                sgNode.syncPortsFromInner();
            }
        });

        syncAllWidgets(mainGraph);

        function registrarOsciloscopios(graph) {
            const oscNodes = graph.findNodesByType("Telecom/Osciloscopio").concat(graph.findNodesByType("Telecom/OsciloscopioOjo"));
            oscNodes.forEach(node => {
                activeOscilloscopes.set(node.id, node);
            });
        }
        registrarOsciloscopios(mainGraph);
        subgrafos.forEach(sgNode => {
            if (sgNode.subgraph) registrarOsciloscopios(sgNode.subgraph);
        });

        syncOscSelector();
        mainGraph.start();
        
        mainGraph.runStep(1);
        mainGraph.runStep(1);

        dirtyPlots = true;
        updatePlots();
        canvas.setDirty(true, true);
        resetView();
    }

    resizeCanvas();
    mainGraph.start();
    requestAnimationFrame(mainLoop);
</script>
